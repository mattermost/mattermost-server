    AccessControlResource:
      type: object
      description: Identifies a resource (type + id) for an ABAC decision request.
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum: [channel]
          description: The resource type.
        id:
          type: string
          description: The resource identifier, such as a channel ID. Must be a valid ID.
    RenderPermissionDecision:
      type: object
      description: |
        A non-authoritative, render-time ABAC decision for a single action.
        Must not be used to authorize an action — server enforcement is authoritative.
      required:
        - allowed
        - evaluated
      properties:
        allowed:
          type: boolean
          description: Whether the action is permitted for rendering purposes.
        evaluated:
          type: boolean
          description: Whether the server intentionally computed this decision.
        reason:
          type: string
          enum: [restricted_by_policy]
          description: >
            `restricted_by_policy` when the server couldn't evaluate the
            action and denied it to be safe; empty on an ordinary deny. Never
            names policies, expressions or attribute values.
    ActionSearchResult:
      type: object
      required:
        - action
      properties:
        action:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              description: Name of a permitted action. Denial is expressed by omission from the results list.
    ActionSearchSubject:
      type: object
      description: >
        RESERVED for Phase 3 cross-subject evaluation. In Phase 2 the ID must equal
        the authenticated session user ID; mismatches return 403. Present to allow
        Phase 3 as a non-breaking extension.
      required:
        - id
      properties:
        id:
          type: string
        type:
          type: string
    ActionSearchPage:
      type: object
      description: >
        RESERVED for Phase 3 pagination. Accepted in requests but always ignored;
        next_token is never emitted in responses. Present to allow Phase 3
        pagination as a non-breaking extension.
      properties:
        next_token:
          type: string
    ActionSearchRequest:
      type: object
      description: Request body for the Action Search render-decision endpoint.
      required:
        - resource
      properties:
        resource:
          $ref: "#/components/schemas/AccessControlResource"
        actions:
          type: array
          description: >
            Actions to evaluate, at most 16. Leave empty or omit for discovery
            mode, which returns the permitted set of all registered actions for
            the resource type. An unregistered action returns 400, including
            `create_burn_on_read_post` on servers earlier than 12.1.
          maxItems: 16
          items:
            type: string
            enum: [upload_file_attachment, download_file_attachment, create_burn_on_read_post]
        subject:
          $ref: "#/components/schemas/ActionSearchSubject"
        page:
          $ref: "#/components/schemas/ActionSearchPage"
    ActionSearchResponse:
      type: object
      description: Response from the Action Search render-decision endpoint.
      required:
        - resource
        - results
        - decisions
      properties:
        resource:
          $ref: "#/components/schemas/AccessControlResource"
        results:
          type: array
          description: >
            AuthZEN-canonical list: only PERMITTED actions appear here.
            Denial is expressed by omission. Always present; an empty array []
            is meaningful (all evaluated actions were denied).
          items:
            $ref: "#/components/schemas/ActionSearchResult"
        decisions:
          type: object
          description: >
            Mattermost extension: all evaluated actions with full decision detail
            (allowed, evaluated, reason), including denied ones. Always present.
          additionalProperties:
            $ref: "#/components/schemas/RenderPermissionDecision"
        page:
          $ref: "#/components/schemas/ActionSearchPage"
    RecapLimitStatus:
      type: object
      description: The current user's recap limit status including usage and cooldown information
      properties:
        effective_limits:
          $ref: "#/components/schemas/EffectiveRecapLimits"
        daily:
          $ref: "#/components/schemas/DailyUsageStatus"
        cooldown:
          $ref: "#/components/schemas/CooldownStatus"
    EffectiveRecapLimits:
      type: object
      description: Resolved recap limit values for a user. A value of -1 means the limit is disabled/unlimited.
      properties:
        max_recaps_per_day:
          type: integer
          description: Maximum number of recaps the user can create per day (-1 = unlimited)
        max_scheduled_recaps:
          type: integer
          description: Maximum number of scheduled recaps (-1 = unlimited)
        max_channels_per_recap:
          type: integer
          description: Maximum number of channels per recap (-1 = unlimited)
        max_posts_per_recap:
          type: integer
          description: Maximum number of posts per recap (-1 = unlimited)
        max_tokens_per_recap:
          type: integer
          description: Maximum number of tokens per recap (-1 = unlimited)
        max_posts_per_day:
          type: integer
          description: Maximum number of posts that can be processed per day (-1 = unlimited)
        cooldown_minutes:
          type: integer
          description: Cooldown period in minutes between recap creations (-1 = no cooldown)
        source:
          type: string
          enum: [system, group, user]
          description: Where the effective limits originated from
        source_id:
          type: string
          description: Group ID or User ID if overridden, empty for system defaults
    DailyUsageStatus:
      type: object
      description: Daily recap usage tracking
      properties:
        used:
          type: integer
          description: Number of recaps used today
        limit:
          type: integer
          description: Maximum recaps allowed per day
        reset_at:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds when daily usage resets
    CooldownStatus:
      type: object
      description: Cooldown state for recap creation
      properties:
        is_active:
          type: boolean
          description: Whether the cooldown is currently active
        available_at:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds when cooldown ends
        retry_after_seconds:
          type: integer
          description: Seconds until recap creation is available again
    ScheduledRecap:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the scheduled recap
        user_id:
          type: string
          description: The ID of the user who owns this scheduled recap
        title:
          type: string
          description: Title for the scheduled recap
          maxLength: 255
        days_of_week:
          type: integer
          description: >
            Bitmask for days of the week the recap should run.
            Sun=1, Mon=2, Tue=4, Wed=8, Thu=16, Fri=32, Sat=64.
          minimum: 1
          maximum: 127
        time_of_day:
          type: string
          description: Time of day in HH:MM format (e.g., "09:00")
        timezone:
          type: string
          description: IANA timezone (e.g., "America/New_York")
        time_period:
          type: string
          description: The lookback period for the recap content
          enum:
            - last_24h
            - last_week
            - since_last_read
        next_run_at:
          type: integer
          format: int64
          description: The next scheduled execution time in UTC milliseconds
        last_run_at:
          type: integer
          format: int64
          description: The last execution time in UTC milliseconds
        run_count:
          type: integer
          description: Number of times this schedule has executed
        channel_mode:
          type: string
          description: How channels are selected for the recap
          enum:
            - specific
            - all_unreads
        channel_ids:
          type: array
          items:
            type: string
          description: List of channel IDs to include (when channel_mode is "specific")
        custom_instructions:
          type: string
          description: Custom AI instructions for the recap
        agent_id:
          type: string
          description: ID of the AI agent to use for generating the recap
        is_recurring:
          type: boolean
          description: Whether the recap runs on a recurring schedule or just once
        enabled:
          type: boolean
          description: Whether the scheduled recap is active (false when paused)
        create_at:
          type: integer
          format: int64
          description: The time in milliseconds the scheduled recap was created
        update_at:
          type: integer
          format: int64
          description: The time in milliseconds the scheduled recap was last updated
        delete_at:
          type: integer
          format: int64
          description: The time in milliseconds the scheduled recap was soft-deleted (0 if not deleted)
externalDocs:
  description: Find out more about Mattermost
  url: 'https://about.mattermost.com'
security:
  - bearerAuth: []
