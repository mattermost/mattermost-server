    AccessControlPoliciesWithCount:
      type: object
      properties:
        policies:
          type: array
          items:
            $ref: "#/components/schemas/AccessControlPolicy"
        total:
          type: integer
          format: int64
          description: The total number of policies that match the search.
    AccessControlPolicy:
      type: object
      properties:
        id:
          type: string
          description: >
            The unique identifier of the policy. For a `channel` policy it's
            the channel ID, and for a `team` policy it's the team ID.
        name:
          type: string
          maxLength: 128
          description: >
            The name of the policy. Required for `parent` and `permission`
            policies.
        type:
          type: string
          enum: [parent, channel, team, permission]
          description: >
            The type of policy. `parent` is a system-wide policy that channel
            and team policies can import; `channel` and `team` apply to the
            channel or team with the same ID; `permission` restricts actions
            for a system role. The REST API rejects plugin-owned types
            (`<pluginId>:<type>`).
        active:
          type: boolean
          deprecated: true
          description: >
            Deprecated and ignored when a policy is saved. From v12.0,
            auto-adding is set per membership rule in
            `rules[].metadata.auto_add`, which the activate endpoints set.
        create_at:
          type: integer
          format: int64
          description: The time in milliseconds this revision of the policy was saved.
        revision:
          type: integer
          description: >
            The revision number of the policy. Set by the server: 1 when the
            policy is created, then one higher each time it's saved.
        version:
          type: string
          enum: [v0.1, v0.2, v0.3, v0.4, v0.5]
          description: >
            The policy format version, which sets how the policy is validated.
            The server sets it on save: `v0.3`, or `v0.4` for a `channel`
            policy with permission rules. Older policies can have `v0.1` or
            `v0.2`; `v0.5` is for plugin-owned policies.
        roles:
          type: array
          items:
            type: string
          description: >
            The system role a `permission` policy applies to, such as
            `system_guest`, `system_user` or `system_admin`. A `permission`
            policy must have exactly one role.
        imports:
          type: array
          items:
            type: string
          description: >
            The IDs of the `parent` policies this policy imports; users must
            also satisfy their rules. `parent` and `permission` policies can't
            import.
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AccessControlPolicyRule"
          description: >
            The rules of the policy. Rules for the same role and action are
            combined with OR.
        scope:
          type: string
          enum: ["", team]
          description: >
            Empty for a system-wide policy, or `team` for a policy owned by one
            team, such as a `parent` policy created for that team.
        scope_id:
          type: string
          description: The ID of the team when `scope` is `team`.
        props:
          type: object
          additionalProperties: true
          description: >
            Computed by the server and not saved. For a `parent` policy,
            getting it or searching with `include_children` adds `child_ids`
            (the policies that import it), `channel_count` and `team_count`.
    AccessControlPolicyRule:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
          description: >
            A label for the rule. Required for permission rules in a `channel`
            policy, where it must be unique within the policy. A membership
            rule has no name.
        role:
          type: string
          enum: [channel_guest, channel_user, channel_admin]
          description: >
            The channel role a permission rule in a `channel` policy applies
            to. Required for those rules, and must be empty on a membership
            rule.
        actions:
          type: array
          items:
            type: string
            enum: [membership, upload_file_attachment, download_file_attachment, create_burn_on_read_post]
          description: >
            The actions the rule governs: `membership` (who can be a member;
            alone in its rule in a `channel` policy), or
            `upload_file_attachment`, `download_file_attachment`, and
            `create_burn_on_read_post` (who can send burn-on-read posts;
            requires server version 12.1 or later).
        expression:
          type: string
          description: >
            The rule in CEL, for example
            `user.attributes.Department == "Engineering"`. Users for whom it's
            true are allowed the rule's actions. Only a membership rule can
            leave it empty.
        metadata:
          type: object
          description: >
            Settings for the rule that aren't part of the expression. Only
            `auto_add` is accepted.
          properties:
            auto_add:
              type: string
              enum: ["", always]
              description: >
                Membership rule only. `always` adds matching users to the
                channel or team at each sync; empty turns it off. Not
                inherited from imported parents.
    AccessControlPolicySearch:
      type: object
      properties:
        term:
          type: string
          description: Text to match against policy names.
        type:
          type: string
          enum: [parent, channel, team, permission]
          description: The type of policy to return.
        parent_id:
          type: string
          description: Returns only policies that import the parent policy with this ID.
        ids:
          type: array
          items:
            type: string
          description: List of policy IDs to filter by.
        active:
          type: boolean
          deprecated: true
          description: >
            Deprecated. Filters on the legacy `active` field, which no longer
            controls anything. Use `auto_add` instead.
        auto_add:
          type: boolean
          description: >
            `true` returns only policies whose membership rule adds matching
            users automatically, `false` only those that don't. Omit for both.
        actions:
          type: array
          items:
            type: string
            enum: [membership, upload_file_attachment, download_file_attachment, create_burn_on_read_post]
          description: >
            Returns only policies with a rule for at least one of these
            actions. `create_burn_on_read_post` requires server version 12.1
            or later.
        team_id:
          type: string
          description: >
            Returns the `parent` policies a team admin of this team can
            manage: those owned by the team or assigned only to its channels.
            Requires `manage_team_access_rules` on the team.
        scope:
          type: string
          enum: [team]
          description: Returns only policies with this scope. Used together with `scope_id`.
        scope_id:
          type: string
          description: Returns only policies owned by this team. Used together with `scope`.
        include_children:
          type: boolean
          description: >
            When `true` and `parent_id` is empty, adds `child_ids`,
            `channel_count` and `team_count` to each policy's `props`.
        cursor:
          $ref: "#/components/schemas/AccessControlPolicyCursor"
        limit:
          type: integer
          default: 10
          maximum: 1000
          description: The maximum number of policies to return.
    AccessControlPolicyCursor:
      type: object
      properties:
        id:
          type: string
          description: The ID of the policy to start searching after.
    AccessControlPolicyTestResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
          description: A list of users affected by the policy expression.
        total:
          type: integer
          format: int64
          description: The total number of users affected.
    PolicySimulationUserOverride:
      type: object
      description: |
        Per-user input for `/cel/simulate_users`. Each user's profile
        attributes are combined with the requesting admin's own session
        attributes, then `session_overrides`.
      required:
        - user_id
      properties:
        user_id:
          type: string
          description: ID of the user to evaluate the draft policy against.
        use_active_session:
          type: boolean
          deprecated: true
          description: |
            Deprecated and ignored. The requesting admin's session attributes
            are always applied under `session_overrides`, so leave this unset.
        session_overrides:
          type: object
          additionalProperties: true
          description: |
            Replaces individual `session.*` attributes for this user only,
            keeping the rest of the session attributes. Values can be of any
            JSON type.
    PolicySimulationByUsersParams:
      type: object
      description: |
        Request body for `/access_control_policies/cel/simulate_users`. The
        draft policy is compiled in-memory only — nothing is persisted.
      required:
        - policy
        - actions
        - users
      properties:
        policy:
          $ref: "#/components/schemas/AccessControlPolicy"
        actions:
          type: array
          minItems: 1
          items:
            type: string
          description: |
            Permission actions to simulate (e.g. `upload_file_attachment`,
            `download_file_attachment`). At least one action is required —
            the picker UX only makes sense once an action is in scope. The
            backend rejects empty arrays with `app.pap.simulate.missing_actions`
            (HTTP 400); `minItems` lets OpenAPI tooling catch that earlier
            on the client.
        rule_name:
          type: string
          description: |
            Identifies which rule in `policy.rules` the author is editing
            (used for blame attribution). When set, denies originating from
            this rule are tagged `source=this_rule`; other denies in the same
            draft are tagged `source=sibling_rule`.
        channel_id:
          type: string
          description: |
            Provides resource context for delegated channel admins and for
            resource-lane evaluation when `policy.type == "channel"`.
        team_id:
          type: string
          description: Provides team context for team-level delegated admins.
        users:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PolicySimulationUserOverride"
          description: |
            Explicit user list to evaluate, with per-user session-attribute
            overrides. At least one user is required (the backend rejects
            empty arrays with `app.pap.simulate.missing_users`).
        evaluation_scope:
          type: string
          enum: [all, this_rule]
          description: |
            Selects whether the simulator considers only the rule under
            simulation (`this_rule`) or co-evaluates every contributing
            program (`all`). Empty defaults to `this_rule` on the server.
            `this_rule` is the authoring-time "what does this rule alone
            do?" view: useful for iterating on a single rule without
            sibling rules shadowing or compensating for it. `all` mirrors
            the live PDP at request time.
    PolicySimulationBlame:
      type: object
      description: |
        Attributes a deny decision back to the rule or policy that caused it.
      properties:
        source:
          type: string
          enum:
            - this_rule
            - sibling_rule
            - sibling_saved
            - peer_policy
            - system_permission
            - channel_policy
            - no_applicable_policy
            - no_session_data
            - no_applicable_rule
          description: |
            Origin of the blamed contribution.
            * `this_rule`: the rule being edited.
            * `sibling_rule`: another rule in the draft policy.
            * `sibling_saved`: on an allow, another rule allowed what the edited rule alone would deny.
            * `peer_policy`: another policy at the draft's scope.
            * `system_permission`, `channel_policy`: a higher-scoped permission or channel policy, without `expression` or `evaluation_tree`.
            * `no_applicable_policy`: no policy decided (allow).
            * `no_session_data`: the rules use `user.session.*`, but the user has no session attributes or `session_overrides` (allow).
            * `no_applicable_rule`: with `evaluation_scope` `this_rule`, the edited rule doesn't decide this user (allow).
        outcome:
          type: string
          enum:
            - deny
            - allow
          description: |
            Per-blame verdict. Most blame entries describe the deny that
            produced the overall decision (`deny`); the simulator also
            emits informational `allow` entries so the picker can show
            "your draft rule allowed this user" alongside any peer
            policies that actually caused the deny. Consumers that only
            care about deny attribution should filter to `deny`. Empty
            (omitted) is treated as `deny` for backward compatibility
            with simulator builds that pre-date this field.
        policy_id:
          type: string
          description: |
            ID of the contributing policy. Empty when the deny originated
            from the draft itself (no persisted ID exists yet).
        policy_name:
          type: string
          description: Human-readable name of the contributing policy.
        rule_name:
          type: string
          description: Name of the contributing rule.
        role:
          type: string
          description: |
            Scoped role (`system_admin` / `system_user` / `channel_admin` /
            …) the contributing rule targets. Useful for explaining
            role-chain fallbacks.
        expression:
          type: string
          description: |
            CEL text of the contributing rule. Only populated for blame
            entries at the draft's own scope (`this_rule`, `sibling_rule`,
            `sibling_saved`, `peer_policy`).
        evaluation_tree:
          allOf:
            - $ref: "#/components/schemas/PolicySimulationEvaluationNode"
          description: |
            Recursive per-node breakdown of the contributing rule, mirroring
            the boolean shape of the CEL expression's AST. Same scope-privacy
            rule as `expression`. The picker renders it as a structured
            AND/OR/NOT tree highlighting which sub-expression(s) drove the
            deny.
        merged_rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicySimulationMergedRule"
          description: |
            The rules combined with OR into `expression`, in policy order,
            when more than one shares the role and action. Omitted when
            `expression` is.
    PolicySimulationMergedRule:
      type: object
      description: One of the rules combined into a blame entry's expression.
      properties:
        name:
          type: string
          description: Name of the rule.
        expression:
          type: string
          description: CEL text of this rule on its own.
        evaluation_tree:
          allOf:
            - $ref: "#/components/schemas/PolicySimulationEvaluationNode"
          description: |
            Evaluation breakdown of this rule on its own. The root's `outcome`
            says whether this rule alone matched the user.
    PolicySimulationEvaluationNode:
      type: object
      description: |
        One node of an evaluation tree. The tree follows the boolean shape of
        the rule's expression, and every branch is evaluated so each clause
        reports its own outcome.
      properties:
        kind:
          type: string
          enum: [and, or, not, compare, function, other]
          description: |
            The kind of node. `and`, `or` and `not` have `children`;
            `compare` and `function` are leaves; `other` covers anything
            the simulator doesn't break down.
        expression:
          type: string
          description: The text of this part of the expression.
        outcome:
          type: string
          enum: ["true", "false", "error"]
          description: The result for this node.
        error:
          type: string
          description: Why evaluation failed. Present only when `outcome` is `error`.
        operator:
          type: string
          description: |
            The operation of a leaf, such as `==`, `in` or `startsWith`.
            Empty for other nodes.
        attribute:
          type: string
          description: |
            The attribute the leaf reads, such as `user.attributes.region`,
            when it can be identified.
        actual_value:
          type: string
          description: |
            The user's value for `attribute`, formatted for display. Empty when
            the user has no value.
        expected_value:
          type: string
          description: |
            The value or values the leaf compared against, formatted for
            display. Empty when the other side is an attribute.
        children:
          type: array
          items:
            $ref: "#/components/schemas/PolicySimulationEvaluationNode"
          description: The operands of an `and`, `or` or `not` node, in expression order.
    PolicySimulationActionDecision:
      type: object
      description: Per-action verdict for one user (or one session).
      properties:
        decision:
          type: boolean
          description: |
            `true` means ALLOW, `false` means DENY. Pending evaluations
            (rare) surface as `false` paired with an empty `blame` array.
        blame:
          type: array
          items:
            $ref: "#/components/schemas/PolicySimulationBlame"
          description: |
            Ordered blame entries for the decision. The first entry is the
            primary blame (what the picker renders on the chip); subsequent
            entries describe other contributing policies the user can drill
            into via the "Decision details" view.
    PolicySimulationSession:
      type: object
      description: Per-session verdict for one user.
      properties:
        id:
          type: string
          description: The session ID. Empty for a synthetic session.
        device:
          type: string
        network:
          type: string
        last_active_at:
          type: integer
          format: int64
          description: Last-active timestamp in milliseconds since epoch.
        decisions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PolicySimulationActionDecision"
          description: Per-action verdicts for this specific session.
        attributes:
          type: object
          additionalProperties:
            type: string
          description: |
            Session-attribute snapshot used when evaluating this session
            (network_status, device_managed, ip_range, etc.). Surfaced in
            the per-row "Decision details" view.
    PolicySimulationUserResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        decisions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PolicySimulationActionDecision"
          description: |
            Per-action verdicts for the user. When `sessions` is populated
            this represents the "headline" decision (e.g. from the
            most-recently-active session) so the picker can render a
            single chip without consulting `sessions`.
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/PolicySimulationSession"
          description: |
            Optional per-session breakdown. When populated the picker
            renders a Recent activity expand row revealing one decision
            chip per session. Empty/undefined falls back to a single
            user-level chip.
        attributes:
          type: object
          additionalProperties:
            type: string
          description: |
            User profile attribute snapshot used when evaluating this user
            (department, region, clearance, etc.).
    PolicySimulationResponse:
      type: object
      description: |
        Body returned by `/cel/simulate_users`. Per-user, per-action
        verdicts plus blame attribution for any deny.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PolicySimulationUserResult"
        total:
          type: integer
          format: int64
          description: |
            Total number of users evaluated (matches `results.length` for
            the picker endpoint since the caller supplies the user list
            explicitly).
    ChannelSearch: # Added based on dataretention.yaml and access_control.go usage
      type: object
      properties:
        term:
          type: string
          description: The string to search in the channel name, display name, and purpose.
        team_ids:
          type: array
          items:
            type: string
          description: Filters results to channels belonging to the given team ids.
        public:
          type: boolean
          description: Filters results to only return Public / Open channels.
        private:
          type: boolean
          description: Filters results to only return Private channels.
        deleted:
          type: boolean
          description: Filters results to only return deleted / archived channels.
        include_deleted:
          type: boolean
          description: Whether to include deleted channels in the search results.
        # Add other potential search fields like not_associated_to_group, exclude_default_channels etc.
    ChannelsWithCount: # Added based on access_control.go usage
      type: object
      properties:
        channels:
          $ref: "#/components/schemas/ChannelListWithTeamData" # Referencing existing type used in similar contexts
        total_count:
          type: integer
          description: The total number of channels.
    ExpressionError:
      type: object
      properties:
        message:
          type: string
          description: The error message.
        line:
          type: integer
          description: The line number where the error occurred in the expression.
        column:
          type: integer
          description: The column number where the error occurred in the expression.
    QueryExpressionParams:
      type: object
      properties:
        expression:
          type: string
          description: The policy expression to test.
        term:
          type: string
          description: A search term to filter users against whom the expression is tested.
        limit:
          type: integer
          description: The maximum number of users to return.
        after:
          type: string
          description: The ID of the user to start the test after (for pagination).
        channelId:
          type: string
          description: The channel ID to contextually test the expression against (required for channel admins).
        teamId:
          type: string
          description: >
            The team ID, required for team admins, who need
            `manage_team_access_rules` on the team. For a system admin or that
            team admin, only members of the team are returned.
    CELExpression:
      type: object
      properties:
        expression:
          type: string
          description: The CEL expression to visualize.
        channelId:
          type: string
          description: The channel ID to contextually test the expression against (required for channel admins).
        teamId:
          type: string
          description: >
            The team ID, required for team admins, who need the
            `manage_team_access_rules` permission on the team.
    VisualExpression:
      type: object
      properties:
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
          description: The visual AST for the CEL expression
    Condition:
      type: object
      properties:
        attribute:
          type: string
          description: The attribute name.
        operator:
          type: string
          description: The operator of a single condition.
        value:
          description: >
            The value the attribute is compared with: a single literal (usually
            a string), a list of literals for operators such as `in`, or, when
            `value_type` is `1`, the path of another attribute, such as
            `resource.attributes.Clearance`.
        value_type:
          type: integer
          enum: [0, 1]
          description: >
            `0` when `value` is a literal or a list of literals, `1` when it's
            the path of another attribute.
        attribute_type:
          type: string
          description: >
            The type of the attribute, when the expression shows it:
            `multiselect` for a multiselect comparison, or `graph` for a
            hierarchical attribute function such as `coversAll`. Otherwise
            empty.
    ChannelBanner:
      type: object
      properties:
        enabled:
          type: boolean
          description: enabled indicates whether the channel banner is enabled or not
        text:
          type: string
          description: text is the actual text that renders in the channel banner. Markdown is supported.
        background_color:
          type: string
          description: background_color is the HEX color code for the banner's background
    ContentFlaggingConfig:
      type: object
      properties:
        EnableContentFlagging:
          type: boolean
          description: Flag to enable or disable content flagging feature
          example: true
          NotificationSettings:
            $ref: '#/components/schemas/NotificationSettings'
          AdditionalSettings:
            $ref: '#/components/schemas/AdditionalSettings'
          ReviewerSettings:
            $ref: '#/components/schemas/ReviewerSettings'
    NotificationSettings:
      type: object
      properties:
        EventTargetMapping:
          $ref: '#/components/schemas/EventTargetMapping'
      required:
        - EventTargetMapping
    EventTargetMapping:
      type: object
      properties:
        assigned:
          type: array
          items:
            type: string
          description: List of targets to notify when content is assigned
          example: [ ]
        dismissed:
          type: array
          items:
            type: string
          description: List of targets to notify when content is dismissed
          example: [ ]
        flagged:
          type: array
          items:
            type: string
          description: List of targets to notify when content is flagged
          example: [ "reviewers" ]
        removed:
          type: array
          items:
            type: string
          description: List of targets to notify when content is removed
          example: [ ]
      required:
        - assigned
        - dismissed
        - flagged
        - removed
    AdditionalSettings:
      type: object
      properties:
        Reasons:
          type: array
          items:
            type: string
          description: Predefined reasons for flagging content
          example: [ "reason 1", "reason 2", "reason 3" ]
        ReporterCommentRequired:
          type: boolean
          description: Whether a comment is required from the reporter
          example: false
        ReviewerCommentRequired:
          type: boolean
          description: Whether a comment is required from the reviewer
          example: false
        HideFlaggedContent:
          type: boolean
          description: Whether to hide flagged content from general view
          example: true
      required:
        - Reasons
        - ReporterCommentRequired
        - ReviewerCommentRequired
        - HideFlaggedContent
    ReviewerSettings:
      type: object
      properties:
        CommonReviewers:
          type: boolean
          description: Whether to use common reviewers across all teams
          example: true
        SystemAdminsAsReviewers:
          type: boolean
          description: Whether system administrators can act as reviewers
          example: false
        TeamAdminsAsReviewers:
          type: boolean
          description: Whether team administrators can act as reviewers
          example: true
        CommonReviewerIds:
          type: array
          items:
            type: string
          description: List of user IDs designated as common reviewers
          example: [ "onymzj7qcjnz7dcnhtjp1noc3w" ]
        TeamReviewersSetting:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TeamReviewerConfig'
          description: Team-specific reviewer configuration, keyed by team ID
          example:
            "8guxic3sg7nijeu5dgxt1fh4ia":
              Enabled: true
              ReviewerIds: [ ]
            "u1ujk34a47gfxp856pdczs9gey":
              Enabled: false
              ReviewerIds: [ ]
      required:
        - CommonReviewers
        - SystemAdminsAsReviewers
        - TeamAdminsAsReviewers
        - CommonReviewerIds
        - TeamReviewersSetting
    TeamReviewerConfig:
      type: object
      properties:
        Enabled:
          type: boolean
          description: Whether team-specific reviewers are enabled for this team
          example: true
        ReviewerIds:
          type: array
          items:
            type: string
          description: List of user IDs designated as reviewers for this specific team
          example: [ ]
      required:
        - Enabled
        - ReviewerIds
    DeliveryTrackingConfig:
      type: object
      description: >-
        Post delivery audit logging configuration. The toggles are stored in the server
        configuration; the channel list is stored separately in the database.
      properties:
        Enable:
          type: boolean
          description: >-
            Whether an audit log entry is recorded each time a post is delivered to a user.
            The records are emitted on the `audit-delivery` log level, which is not part of
            the default audit file target — an admin must add a target for it via
            `ExperimentalAuditSettings.AdvancedLoggingJSON`.
          example: true
        EnableForAllChannels:
          type: boolean
          description: >-
            When true, deliveries are recorded in every eligible channel. When false, only in
            the channels listed in ChannelIds.
          example: false
        ChannelIds:
          type: array
          items:
            type: string
          description: >-
            IDs of the channels deliveries are recorded in. Only used when
            EnableForAllChannels is false. On update this fully replaces the stored list;
            omit the field to leave it unchanged, or send an empty array to clear it. An
            empty array is only accepted when the resulting configuration is still valid,
            which means EnableForAllChannels must be true. Direct and group message channels
            are rejected.
          example: [ "onymzj7qcjnz7dcnhtjp1noc3w" ]
    HealthFinding:
      type: object
      description: The outcome of one health rule for one subject, as of the server's latest health evaluation.
      properties:
        fingerprint:
          type: string
          description: The finding's stable identity, derived from its code, subject and scope.
        code:
          type: string
          description: The code of the rule that produced the finding.
          example: SITE_URL_HTTP
        subject:
          type: string
          description: What the finding is about, such as a configuration key. Never a configuration value.
          example: ServiceSettings.SiteURL
        scope:
          type: string
          description: The hostname of the node a node-scoped finding belongs to, or empty for a cluster-wide finding.
        severity:
          type: string
          enum: [critical, warning, info]
        state:
          type: string
          description: Whether the rule's condition holds (`firing`), no longer holds (`resolved`), or could not be evaluated (`unknown`).
          enum: [firing, resolved, unknown]
        area:
          type: string
          enum: [auth, database, search, jobs, cluster, notifications, compliance, platform, license, version]
        surface:
          type: string
          description: Which consumers may see the finding. Always `product` in API responses.
          enum: [product]
        message_id:
          type: string
          description: The translation id of `message`.
        details:
          type: object
          description: Finding-specific context used to render `message`.
          additionalProperties:
            type: string
        title:
          type: string
          description: The rule's title in the request locale.
        remediation:
          type: string
          description: How to resolve the finding, in the request locale.
        message:
          type: string
          description: The finding-specific detail in the request locale. For an `unknown` finding, why the rule could not be evaluated.
        docs_url:
          type: string
          description: A link to documentation about the rule. Omitted when the rule has none.
          example: https://mattermost.com/pl/configure-site-url
        console_path:
          type: string
          description: The System Console path of the setting that resolves the finding. Omitted when the rule has none.
          example: /admin_console/environment/web_server
        first_seen_at:
          type: integer
          format: int64
          description: The time in milliseconds the finding was first recorded.
        last_seen_at:
          type: integer
          format: int64
          description: The time in milliseconds the finding was last evaluated.
        state_since:
          type: integer
          format: int64
          description: The time in milliseconds the finding entered its current state.
        muted_at:
          type: integer
          format: int64
          description: The time in milliseconds the finding was muted. Omitted when the finding is not muted.
        muted_by:
          type: string
          description: The id of the user who muted the finding. Omitted when the finding is not muted.
    HealthFindingList:
      type: object
      properties:
        evaluated_at:
          type: integer
          format: int64
          description: The time in milliseconds the server last evaluated its health rules, or 0 if it has not evaluated yet or no health rule has fired yet.
        findings:
          type: array
          items:
            $ref: "#/components/schemas/HealthFinding"
    AccessControlPolicyActiveUpdateRequest:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AccessControlPolicyActiveUpdate"
        team_id:
          type: string
          description: >
            The ID of the team, required for a team admin who has the
            `manage_team_access_rules` permission on it.
    AccessControlPolicyActiveUpdate:
      type: object
      properties:
        id:
          type: string
          description: The ID of the policy.
        active:
          type: boolean
          description: >
            `true` turns auto-add on for the policy's membership rule, and
            `false` turns it off.
    Recap:
      type: object
