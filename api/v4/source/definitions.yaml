components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Forbidden:
      description: Do not have appropriate permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
    Unauthorized:
      description: No access token provided
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
    BadRequest:
      description: Invalid or missing parameters in URL or request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
    Conflict:
      description: Request conflicts with current state of the resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
    TooLarge:
      description: Content too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
    NotImplemented:
      description: Feature is disabled
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
    InternalServerError:
      description: Something went wrong with the server
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
    BadGateway:
      description: Bad gateway
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        create_at:
          description: The time in milliseconds a user was created
          type: integer
          format: int64
        update_at:
          description: The time in milliseconds a user was last updated
          type: integer
          format: int64
        delete_at:
          description: The time in milliseconds a user was deleted
          type: integer
          format: int64
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        nickname:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        auth_service:
          type: string
        roles:
          type: string
        locale:
          type: string
        notify_props:
          $ref: "#/components/schemas/UserNotifyProps"
        props:
          type: object
        last_password_update:
          type: integer
          format: int64
        last_picture_update:
          type: integer
          format: int64
        failed_attempts:
          type: integer
        mfa_active:
          type: boolean
        timezone:
          $ref: "#/components/schemas/Timezone"
        terms_of_service_id:
          description: ID of accepted terms of service, if any. This field is not present
            if empty.
          type: string
        terms_of_service_create_at:
          description: The time in milliseconds the user accepted the terms of service
          type: integer
          format: int64
    UsersStats:
      type: object
      properties:
        total_users_count:
          type: integer
    KnownUsers:
      type: array
      properties:
        items:
          type: string
    Team:
      type: object
      properties:
        id:
          type: string
        create_at:
          description: The time in milliseconds a team was created
          type: integer
          format: int64
        update_at:
          description: The time in milliseconds a team was last updated
          type: integer
          format: int64
        delete_at:
          description: The time in milliseconds a team was deleted
          type: integer
          format: int64
        display_name:
          type: string
        name:
          type: string
        description:
          type: string
        email:
          type: string
        type:
          type: string
        allowed_domains:
          type: string
        invite_id:
          type: string
        allow_open_invite:
          type: boolean
        policy_id:
          type: string
          description: >-
            The data retention policy to which this team has been assigned. If no such policy exists,
            or the caller does not have the `sysconsole_read_compliance_data_retention` permission,
            this field will be null.
    TeamStats:
      type: object
      properties:
        team_id:
          type: string
        total_member_count:
          type: integer
    TeamExists:
      type: object
      properties:
        exists:
          type: boolean
    Channel:
      type: object
      properties:
        id:
          type: string
        create_at:
          description: The time in milliseconds a channel was created
          type: integer
          format: int64
        update_at:
          description: The time in milliseconds a channel was last updated
          type: integer
          format: int64
        delete_at:
          description: The time in milliseconds a channel was deleted
          type: integer
          format: int64
        team_id:
          type: string
        type:
          type: string
        display_name:
          type: string
        name:
          type: string
        header:
          type: string
        purpose:
          type: string
        last_post_at:
          description: The time in milliseconds of the last post of a channel
          type: integer
          format: int64
        total_msg_count:
          type: integer
        extra_update_at:
          description: Deprecated in Mattermost 5.0 release
          type: integer
          format: int64
        creator_id:
          type: string
    ChannelStats:
      type: object
      properties:
        channel_id:
          type: string
        member_count:
          type: integer
    ChannelMember:
      type: object
      properties:
        channel_id:
          type: string
        user_id:
          type: string
        roles:
          type: string
        last_viewed_at:
          description: >-
            The time in milliseconds the channel was last viewed by the user.
            This field is omitted when the membership belongs to a user other
            than the requester, as the value is private to that user.
          type: integer
          format: int64
          nullable: true
        msg_count:
          type: integer
        mention_count:
          type: integer
        notify_props:
          $ref: "#/components/schemas/ChannelNotifyProps"
        last_update_at:
          description: >-
            The time in milliseconds the channel member was last updated. This
            field is omitted when the membership belongs to a user other than
            the requester, as the value is private to that user.
          type: integer
          format: int64
          nullable: true
    ChannelMemberWithTeamData:
      allOf:
        - $ref: "#/components/schemas/ChannelMember"
        - type: object
          properties:
            team_display_name:
              type: string
              description: The display name of the team to which this channel belongs.
            team_name:
              type: string
              description: The name of the team to which this channel belongs.
            team_update_at:
              type: integer
              description: The time at which the team to which this channel belongs was last updated.
    ChannelData:
      type: object
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        member:
          $ref: "#/components/schemas/ChannelMember"
    ChannelWithTeamData:
      allOf:
        - $ref: "#/components/schemas/Channel"
        - type: object
          properties:
            team_display_name:
              type: string
              description: The display name of the team to which this channel belongs.
            team_name:
              type: string
              description: The name of the team to which this channel belongs.
            team_update_at:
              type: integer
              description: The time at which the team to which this channel belongs was last updated.
            policy_id:
              type: string
              description: >-
                The data retention policy to which this team has been assigned. If no such policy exists,
                or the caller does not have the `sysconsole_read_compliance_data_retention` permission, this field
                will be null.
    ChannelListWithTeamData:
      type: array
      items:
        $ref: "#/components/schemas/ChannelWithTeamData"
    ChannelBookmark:
      type: object
      properties:
        id:
          type: string
        create_at:
          description: The time in milliseconds a channel bookmark was created
          type: integer
          format: int64
        update_at:
          description: The time in milliseconds a channel bookmark was last updated
          type: integer
          format: int64
        delete_at:
          description: The time in milliseconds a channel bookmark was deleted
          type: integer
          format: int64
        channel_id:
          type: string
        owner_id:
          description: The ID of the user that the channel bookmark belongs to
          type: string
        file_id:
          description: The ID of the file associated with the channel bookmark
          type: string
        display_name:
          type: string
        sort_order:
          description: The order of the channel bookmark
          type: integer
          format: int64
        link_url:
          description: The URL associated with the channel bookmark
          type: string
        image_url:
          description: The URL of the image associated with the channel bookmark
          type: string
        emoji:
          type: string
        type:
          type: string
          enum: [link, file, board]
        target_id:
          type: string
          description: Mattermost 26-character ID of a referenced Mattermost entity when the bookmark includes one.
        original_id:
          description: The ID of the original channel bookmark
          type: string
        parent_id:
          description: The ID of the parent channel bookmark
          type: string
    ChannelBookmarkWithFileInfo:
      allOf:
        - $ref: "#/components/schemas/ChannelBookmark"
        - type: object
          properties:
            file:
              $ref: "#/components/schemas/FileInfo"
    UpdateChannelBookmarkResponse:
      type: object
      properties:
        updated:
          $ref: "#/components/schemas/ChannelBookmarkWithFileInfo"
        deleted:
          $ref: "#/components/schemas/ChannelBookmarkWithFileInfo"
    View:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the view
        channel_id:
          type: string
          description: The ID of the channel this view belongs to
        type:
          type: string
          enum: [kanban]
        creator_id:
          type: string
          description: The ID of the user who created this view
        title:
          type: string
          description: The title of the view
        description:
          type: string
          description: The description of the view
        sort_order:
          type: integer
          description: The display order of the view within the channel
        props:
          type: object
          description: Arbitrary key-value properties for the view
          additionalProperties: true
        create_at:
          description: The time in milliseconds the view was created
          type: integer
          format: int64
        update_at:
          description: The time in milliseconds the view was last updated
          type: integer
          format: int64
        delete_at:
          description: The time in milliseconds the view was deleted
          type: integer
          format: int64
    ViewPatch:
      type: object
      description: Fields that can be updated on a view via PATCH
      properties:
        title:
          type: string
        description:
          type: string
        sort_order:
          type: integer
        props:
          type: object
          description: Arbitrary key-value properties for the view
          additionalProperties: true
    ViewsWithCount:
      type: object
      description: Paginated list of views with total count
      properties:
        views:
          type: array
          items:
            $ref: "#/components/schemas/View"
        total_count:
          type: integer
          format: int64
          description: Total number of views matching the query (ignoring pagination)
    Post:
      type: object
      properties:
        id:
          type: string
        create_at:
          description: The time in milliseconds a post was created
          type: integer
          format: int64
        update_at:
          description: The time in milliseconds a post was last updated
          type: integer
          format: int64
        delete_at:
          description: The time in milliseconds a post was deleted
          type: integer
          format: int64
        edit_at:
          type: integer
          format: int64
        user_id:
          type: string
        channel_id:
          type: string
        root_id:
          type: string
        original_id:
          type: string
        message:
          type: string
        type:
          type: string
        props:
          type: object
        hashtag:
          type: string
        file_ids:
          type: array
          items:
            type: string
        pending_post_id:
          type: string
        metadata:
          $ref: "#/components/schemas/PostMetadata"
    PostPriority:
      type: object
      description: Priority metadata associated with a post or draft.
      properties:
        priority:
          type: string
          description: The priority label of a post, either empty, important, or urgent.
          enum:
            - ""
            - important
            - urgent
        requested_ack:
          type: boolean
          description: Whether the post author has requested acknowledgements.
        persistent_notifications:
          type: boolean
          description: Whether persistent notifications are enabled for the post.
    PostInfo:
      type: object
      description: Additional team and channel context metadata for a post.
      properties:
        channel_id:
          type: string
          description: The ID of the channel containing the post.
        channel_type:
          type: string
          description: The type of the channel containing the post.
        channel_display_name:
          type: string
          description: The display name of the channel containing the post.
        has_joined_channel:
          type: boolean
          description: Whether the requesting user is already a member of the channel.
        team_id:
          type: string
          description: The ID of the team containing the channel, if applicable.
        team_type:
          type: string
          description: The type of the team containing the channel, if applicable.
        team_display_name:
          type: string
          description: The display name of the team containing the channel, if applicable.
        has_joined_team:
          type: boolean
          description: Whether the requesting user is already a member of the team.
    Draft:
      type: object
      properties:
        create_at:
          type: integer
          format: int64
        update_at:
          type: integer
          format: int64
        delete_at:
          type: integer
          format: int64
          description: Deprecated. Drafts are hard-deleted.
        user_id:
          type: string
        channel_id:
          type: string
        root_id:
          type: string
        message:
          type: string
        type:
          type: string
        props:
          type: object
          additionalProperties: true
        file_ids:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/PostMetadata"
        priority:
          $ref: "#/components/schemas/PostPriority"
    DraftUpsertRequest:
      type: object
      required:
        - channel_id
        - message
      properties:
        channel_id:
          type: string
        root_id:
          type: string
        message:
          type: string
          description: Draft message. Set to an empty string to delete the draft.
        type:
          type: string
        props:
          type: object
          additionalProperties: true
        file_ids:
          type: array
          items:
            type: string
        priority:
          $ref: "#/components/schemas/PostPriority"
    NotifyAdminToUpgradeRequest:
      type: object
      properties:
        trial_notification:
          type: boolean
        required_plan:
          type: string
        required_feature:
          type: string
    PluginReattachAddress:
      type: object
      properties:
        Name:
          type: string
        Net:
          type: string
    PluginReattachConfig:
      type: object
      properties:
        Protocol:
          type: string
        ProtocolVersion:
          type: integer
        Addr:
          $ref: "#/components/schemas/PluginReattachAddress"
        Pid:
          type: integer
        Test:
          type: boolean
    PluginReattachRequest:
      type: object
      required:
        - Manifest
        - PluginReattachConfig
      properties:
        Manifest:
          $ref: "#/components/schemas/PluginManifest"
        PluginReattachConfig:
          $ref: "#/components/schemas/PluginReattachConfig"
    InstallMarketplacePluginRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The ID of the plugin to install.
        version:
          type: string
          description: Optional plugin version. If omitted, the latest compatible version is installed.
    RemoteClusterMsg:
      type: object
      properties:
        id:
          type: string
        topic:
          type: string
        create_at:
          type: integer
          format: int64
        payload:
          description: Raw message payload.
          type: object
          additionalProperties: true
    RemoteClusterFrame:
      type: object
      properties:
        remote_id:
          type: string
        msg:
          $ref: "#/components/schemas/RemoteClusterMsg"
    RemoteClusterPing:
      type: object
      properties:
        sent_at:
          type: integer
          format: int64
        recv_at:
          type: integer
          format: int64
    RemoteClusterResponse:
      type: object
      properties:
        status:
          type: string
        err:
          type: string
        payload:
          description: Raw response payload.
          type: object
          additionalProperties: true
    PropertyField:
      type: object
      properties:
        id:
          type: string
        group_id:
          type: string
        name:
          type: string
          description: >
            The name of the field. In the `access_control` group it's used in
            access rule expressions, so it must match `^[A-Za-z_][A-Za-z0-9_]*$`
            and not be a CEL reserved word (422 otherwise).
        type:
          type: string
          description: >
            The type of property. `rank` is a select with ordered options;
            `graph` is a multiselect whose options can sit below other options.
            A field can't be converted to or from `graph`.
          enum: [text, select, multiselect, date, user, multiuser, rank, graph, number, checkbox]
        object_type:
          type: string
          description: The type of object this property applies to
          enum: [post, channel, user, template, session, system]
        attrs:
          type: object
          description: >
            Additional attributes. In the `access_control` group,
            `display_name` is the label shown in the UI, up to 255 characters
            (400 otherwise).


            `options` lists a field's options. Above 1000 options, reads omit
            it and set `options_count` and `options_omitted`, writes can't
            supply it (400), and the property field options endpoints manage
            the options instead. A `graph` option written here may carry
            `parents`; only the options endpoints return them.
        target_id:
          type: string
          description: The ID of the target (empty for system-level, team ID for team-level, channel ID for channel-level)
        target_type:
          type: string
          description: The scope level (system, team, channel)
        protected:
          type: boolean
          description: Whether this field is protected from API modification
        permission_field:
          type: string
          description: >
            Permission level for editing (and deleting) the field definition.
            `creator` resolves to the field's `created_by`, in addition to
            everyone `admin` grants, and is only valid on fields whose object
            type is `post` or `channel`.
          enum: [none, sysadmin, member, admin, creator]
        permission_values:
          type: string
          description: >
            Permission level for setting values on objects. `creator` resolves
            to the creator of the object the value is attached to (a post's
            author, a channel's creator), in addition to everyone `admin`
            grants, and is only valid on fields whose object type is `post` or
            `channel`.
          enum: [none, sysadmin, member, admin, creator]
        permission_options:
          type: string
          description: >
            Permission level for managing options on select/multiselect fields.
            `creator` resolves to the field's `created_by`, in addition to
            everyone `admin` grants, and is only valid on fields whose object
            type is `post` or `channel`.
          enum: [none, sysadmin, member, admin, creator]
        linked_field_id:
          type: string
          nullable: true
          description: >
            The ID of the template field this field is linked to, or null. A
            linked field inherits its type and options and can't change them.
            Set only at creation; patch to an empty string to unlink.
        create_at:
          type: integer
          format: int64
        update_at:
          type: integer
          format: int64
        delete_at:
          type: integer
          format: int64
        created_by:
          type: string
          description: User ID of the user who created this property field
        updated_by:
          type: string
          description: User ID of the user who last updated this property field
    PropertyFieldPatch:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [text, select, multiselect, date, user, multiuser, rank, graph]
        attrs:
          type: object
        linked_field_id:
          type: string
          description: >
            Set to empty string to unlink a linked field. Cannot be set to a new
            value on an existing field; linking is only allowed at creation time.
    ChannelAttributeAdmin:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        nickname:
          type: string
    ChannelMissingAttributeValue:
      type: object
      properties:
        channel_id:
          type: string
        channel_name:
          type: string
        channel_display_name:
          type: string
        channel_type:
          type: string
        team_id:
          type: string
        team_display_name:
          type: string
        is_local:
          type: boolean
          description: False for shared channels, which do not block making the attribute required.
        channel_admins:
          type: array
          description: Empty when the channel has no channel admin.
          items:
            $ref: "#/components/schemas/ChannelAttributeAdmin"
    ChannelsMissingAttributeValueList:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelMissingAttributeValue"
        total_count:
          type: integer
          format: int64
    ChannelAttributeComplianceSummary:
      type: object
      properties:
        field_id:
          type: string
        required:
          type: boolean
        missing_channel_count:
          type: integer
          format: int64
        shared_channel_count:
          type: integer
          format: int64
        unique_admin_count:
          type: integer
          format: int64
        channels_without_admin_count:
          type: integer
          format: int64
        message_preview:
          type: string
          description: The message channel admins would receive, as Markdown.
    ChannelAttributeNotifyResult:
      type: object
      description: >
        Returned when the notification is accepted. Direct messages are
        delivered in the background after the response, so the counts describe
        who was queued to receive a message, not who has received one.
      properties:
        queued_admin_count:
          type: integer
          format: int64
          description: The number of channel admins queued to receive a direct message.
        queued_channel_count:
          type: integer
          format: int64
          description: The number of channels with an admin that are covered by the queued messages.
        channels_without_admin_count:
          type: integer
          format: int64
        truncated:
          type: boolean
          description: True when the number of channel admins to notify hit the server's limit, so some were not queued.
    PropertyValue:
      type: object
      properties:
        id:
          type: string
        target_id:
          type: string
        target_type:
          type: string
        group_id:
          type: string
        field_id:
          type: string
        value:
          description: >
            The property's value. A string for `text` and `date`, an option ID
            for `select` and `rank`, a user ID for `user`, and an array of
            option IDs or user IDs for `multiselect`, `graph` and `multiuser`.
            `number` stores a JSON number, and `checkbox` a JSON boolean.
        create_at:
          type: integer
          format: int64
        update_at:
          type: integer
          format: int64
        delete_at:
          type: integer
          format: int64
        created_by:
          type: string
          description: User ID of the user who created this property value
        updated_by:
          type: string
          description: User ID of the user who last updated this property value
    PropertyFieldOption:
      type: object
      description: >
        One option of a property field, as the property field options
        endpoints read and write it.
      properties:
        id:
          type: string
          description: >
            The option ID. Assigned by the server when the option is created;
            don't send it when creating an option. Required when updating one.
        name:
          type: string
          description: >
            The option name. Required on every write. Names are unique among
            the options a field has, including options it inherits from a
            template.
        color:
          type: string
          description: The option color. Left as it was when omitted on an update.
        attrs:
          type: object
          description: >
            Additional attributes of the option. Can't contain the keys `id`,
            `name`, `color` or `rank`. Left as they were when omitted on an
            update.
        parents:
          type: array
          items:
            type: string
          description: >
            `graph` fields only: the names of up to 100 options directly above
            this one; none makes it top-level. Omitting it on an update keeps
            the current parents. A cycle or a hierarchy deeper than 100 levels
            returns 400.
        read_only:
          type: boolean
          description: >
            `true` when the option is inherited from the linked template, where
            it must be changed. Ignored on writes.
        create_at:
          type: integer
          format: int64
          description: When the option was created. Ignored on writes.
    PropertyFieldOptionPage:
      type: object
      description: One page of a property field's options.
      properties:
        options:
          type: array
          items:
            $ref: "#/components/schemas/PropertyFieldOption"
        has_more:
          type: boolean
          description: >
            Whether more options follow. Keep requesting pages while this is
            `true`; a short or empty page doesn't mean the listing has ended.
        next_cursor_create_at:
          type: integer
          format: int64
          description: Pass as `cursor_create_at` to get the next page.
        next_cursor_id:
          type: string
          description: Pass as `cursor_id` to get the next page.
    FileInfoList:
      type: object
      properties:
        order:
          type: array
          items:
            type: string
          example:
            - file_info_id1
            - file_info_id2
        file_infos:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FileInfo"
        next_file_id:
          type: string
          description: The ID of next file info. Not omitted when empty or not relevant.
        prev_file_id:
          type: string
          description: The ID of previous file info. Not omitted when empty or not relevant.
