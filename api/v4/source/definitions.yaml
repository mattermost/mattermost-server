      type: object
      properties:
        order:
          type: array
          items:
            type: string
          example:
            - post_id1
            - post_id12
        posts:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Post"
        matches:
          description: A mapping of post IDs to a list of matched terms within the post.
            This field will only be populated on servers running version 5.1 or
            greater with Elasticsearch enabled.
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            post_id1:
              - search match 1
              - search match 2
    PostMetadata:
      type: object
      description: Additional information used to display a post.
      properties:
        embeds:
          type: array
          description: >
            Information about content embedded in the post including OpenGraph
            previews, image link previews, and message attachments.
            This field will be null if the post does not contain embedded content.
          items:
            type: object
            properties:
              type:
                type: string
                description: The type of content that is embedded in this point.
                enum:
                  - image
                  - message_attachment
                  - opengraph
                  - link
              url:
                type: string
                description: The URL of the embedded content, if one exists.
              data:
                type: object
                description: >
                  Any additional information about the embedded content. Only
                  used at this time to store OpenGraph metadata.

                  This field will be null for non-OpenGraph embeds.
        emojis:
          type: array
          description: >
            The custom emojis that appear in this point or have been used in
            reactions to this post. This field will be null if the post does not contain custom emojis.
          items:
            $ref: "#/components/schemas/Emoji"
        files:
          type: array
          description: >
            The FileInfo objects for any files attached to the post. This field
            will be null if the post does not have any file attachments.
          items:
            $ref: "#/components/schemas/FileInfo"
        images:
          type: object
          description: >
            An object mapping the URL of an external image to an object
            containing the dimensions of that image. This field will be
            null if the post or its embedded content does not reference any external images.
          items:
            type: object
            properties:
              height:
                type: integer
              width:
                type: integer
        reactions:
          type: array
          description: >
            Any reactions made to this point. This field will be null if no
            reactions have been made to this post.
          items:
            $ref: "#/components/schemas/Reaction"
        priority:
          allOf:
            - $ref: "#/components/schemas/PostPriority"
          description: >
            Post priority set for this post. This field will be null if no
            priority metadata has been set.
        acknowledgements:
          type: array
          description: >
            Any acknowledgements made to this point.
          items:
            $ref: "#/components/schemas/PostAcknowledgement"
        property_values:
          type: array
          description: >
            The property values attached to this post for the property group named in the
            `propertyGroup` query parameter. Present only when that parameter was
            supplied, the lookup succeeded, and the post has at least one value in that group.
          items:
            $ref: "#/components/schemas/PropertyValue"
        property_values_unavailable:
          type: boolean
          description: >
            Present on every post the `propertyGroup` query parameter asked to hydrate, and
            omitted otherwise. Deleted posts and burn-on-read posts the caller has not revealed
            are never hydrated, so they omit it even when `propertyGroup` is set. `false` means
            the lookup succeeded, so an absent `property_values` means the post has no values
            in that group. `true` means the lookup failed: it does **not** mean the post has no
            property values, it means they could not be retrieved, and `property_values` is
            therefore absent or incomplete. When the field is omitted, the response says nothing
            about the post's property values.
