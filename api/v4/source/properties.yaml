          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "501":
          $ref: "#/components/responses/NotImplemented"
    patch:
      tags:
        - properties
      summary: Update property field options
      description: >
        Update options that a property field owns. Identify each option by its
        `id` and include its `name`, even if the name isn't changing. Options
        inherited from a template (`read_only`) can only be changed on the
        template.


        __Minimum server version__: 12.0


        ##### Permissions


        Requires permission to manage the field's options.
      operationId: UpdatePropertyFieldOptions
      parameters:
        - name: group_name
          in: path
          description: The name of the property group
          required: true
          schema:
            type: string
        - name: object_type
          in: path
          description: The object type of the property field
          required: true
          schema:
            type: string
        - name: field_id
          in: path
          description: Property field ID
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 200
              items:
                $ref: "#/components/schemas/PropertyFieldOption"
        description: The options to update
        required: true
      responses:
        "200":
          description: Property field options update successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PropertyFieldOption"
        "400":
          description: >
            An option is invalid or inherited from a template; the field's type
            has no options; it's a `rank` field, whose options are set through
            its `attrs.options`; or it's linked to a `graph` template, whose
            options can only be changed on the template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The field changed while the request was being processed. Retry the
            request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      tags:
        - properties
      summary: Delete property field options
      description: >
        Delete options that a property field owns, together with their parent
        links. Values that refer to a deleted option are kept but ignored. On a
        hierarchical (`graph`) field, an option with options below it must be
