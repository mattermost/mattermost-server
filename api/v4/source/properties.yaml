                items:
                  $ref: "#/components/schemas/PropertyFieldOption"
        "400":
          description: >
            An option is invalid, such as a name the field already has; the
            field's type has no options; it's a `rank` field, whose options are
            set through its `attrs.options`; it's linked to a `graph` template,
            whose options can only be changed on the template; or a `graph`
